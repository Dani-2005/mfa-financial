# Compilación de la app de iOS/iPadOS en Codemagic (Macs en la nube con el
# Xcode más reciente), para instalarla en iPhones/iPads SIN App Store ni
# TestFlight: genera un .ipa firmado "Ad Hoc" que solo abre en los
# dispositivos registrados en la cuenta de Apple Developer.
#
# Antes de la primera compilación, en Codemagic → Settings → Code signing
# identities (de la misma cuenta/equipo donde está la app):
#   - iOS certificates: un certificado "Apple Distribution" con su clave
#     privada (el botón "Generate certificate" lo crea y la guarda).
#   - iOS provisioning profiles: el perfil Ad Hoc de com.maffinancial.app,
#     creado en Apple con ESE certificado y con los iPads/iPhones marcados.
# La firma sale de ahí; la API key de App Store Connect solo se usa desde la
# pantalla de Codemagic para "Generate"/"Fetch", no hace falta nombrarla aquí.
#
# Cada vez que se registra un dispositivo nuevo hay que editar el perfil en
# Apple, volver a bajarlo en Codemagic ("Fetch profiles") y compilar de nuevo.

workflows:
  ios-adhoc:
    name: iOS Ad Hoc (iPad / iPhone)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.maffinancial.app
    scripts:
      - name: Dependencias de Flutter
        script: flutter pub get
      - name: Aplicar certificado y perfil de firma
        script: xcode-project use-profiles
      # Sin sección "triggering": solo se compila al lanzarlo a mano desde
      # Codemagic ("Start new build"), no con cada push. `flutter build ipa`
      # genera el Podfile y corre `pod install` solo.
      - name: Compilar el .ipa
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
